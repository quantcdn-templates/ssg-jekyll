name: Deploy to QuantCDN

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Template repositories have no Quant credentials; they only verify the build.
      DEPLOY_CONFIGURED: ${{ (vars.QUANT_CUSTOMER || secrets.QUANT_CUSTOMER) != '' && (vars.QUANT_PROJECT || secrets.QUANT_PROJECT) != '' && secrets.QUANT_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deployment setup
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo 'Build verified. Deployment requires QUANT_CUSTOMER and QUANT_PROJECT variables and a QUANT_TOKEN secret.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to QuantCDN
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: quantcdn/deploy-action@9bf8cae8497ab6628d4b248db9eb11464f37e1e5 # v7.0.1
        with:
          customer: ${{ vars.QUANT_CUSTOMER || secrets.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT || secrets.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          dir: _site

      - name: Purge QuantCDN cache
        if: env.DEPLOY_CONFIGURED == 'true'
        uses: quantcdn/purge-action@6010adb4bef33827d7f7d1be8b1d955f693568e4 # v7.0.0
        with:
          customer: ${{ vars.QUANT_CUSTOMER || secrets.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT || secrets.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          url_pattern: "/*"
